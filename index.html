<style>
/* ===== THEME TOKENS (set from Settings > Branding) ===== */
:root{
  --green:#14375a;     /* primary (header, buttons) */
  --green-2:#3f6089;   /* lighter working shade of the primary */
  --lime:#bde6ff;      /* highlight (captions and buttons on the primary) */
  --orange:#f2a541;    /* accent */
  --orange-d:#975f10;  /* accent darkened for text on light backgrounds */
  --org1:#f2a541; --org2:#5fa8d3;
  --cream:#faf6ef; --ink:#10282a; --muted:#52655f; --line:#e4ded1; --card:#fff;
  --row:60px;
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;font-family:"Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:1rem;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--green);color:#fff;padding:14px 28px 18px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--orange) 0 50%,var(--lime) 50% 100%)}
.logos{display:flex;align-items:center;gap:12px}
.logo-slot{height:68px;padding:8px 14px;border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(255,255,255,.28)}
.logo-slot img{height:100%;width:auto;max-width:230px;object-fit:contain;display:block}
.x{color:var(--lime);font-size:24px;font-weight:300}
.titles{flex:1;min-width:260px}
.titles h1{margin:0;font-size:1.75rem;font-weight:700;letter-spacing:.01em;line-height:1.15}
.titles p{margin:4px 0 0;color:var(--lime);font-size:1rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:.95rem}
.btn:hover{border-color:#b9b19f}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn.ghost:hover{background:rgba(255,255,255,.12);border-color:#fff}
.btn.lime{background:var(--lime);color:var(--green);border-color:var(--lime)}
.btn.lime:hover{filter:brightness(.95)}
.btn.primary{background:var(--green);color:var(--lime);border-color:var(--green)}
.btn.primary:hover{background:var(--green-2)}
.btn.danger{color:#b3261e;border-color:#f0c4c0}
.btn.small{padding:5px 11px;font-size:.85rem}
.btn svg{vertical-align:-3px;margin-right:6px}
.menu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.28);min-width:270px;padding:8px;z-index:70}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 13px;border-radius:8px;cursor:pointer;font-weight:700;font-size:1rem}
.menu button small{display:block;font-weight:400;color:var(--muted);font-size:.85rem;margin-top:2px}
.menu button:hover{background:#f3efe4}
.layout{width:100%;padding:20px 24px 56px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:12px}
.daytab{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 18px 10px 14px;cursor:pointer;color:var(--green)}
.daytab input{width:20px;height:20px;accent-color:var(--green);cursor:pointer;margin:0}
.daytab .dt b{display:block;font-size:1.05rem}
.daytab .dt small{display:block;font-weight:500;color:var(--muted);font-size:.85rem}
.daytab:hover{border-color:var(--green)}
.daytab.active{background:var(--green);color:var(--lime);border-color:var(--green);box-shadow:inset 0 -4px 0 var(--orange)}
.daytab.active .dt small{color:#fff;opacity:.88}
.daytab.active input{accent-color:var(--lime)}
.dropping{outline:3px dashed var(--orange);outline-offset:-3px}
.daytab.dropping{outline-offset:2px}
.daybar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.daybar input,.daybar select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:1rem}
.daybar .title{flex:0 1 280px;min-width:180px;font-weight:700;color:var(--green);font-size:1.05rem}
.daybar .viewing{font-weight:700;color:var(--green);font-size:1.05rem}
.daybar .meta{color:var(--muted);font-size:.9rem}
.daybar .grow{flex:1}
.footnote{margin:12px 4px 0;color:var(--muted);font-size:.875rem}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:12px}
.ov.sub{z-index:60}
.modal.narrow{width:min(560px,100%)}
.modal form{grid-template-columns:minmax(0,1fr)}
.modal form>*,.frow>*{min-width:0}
label.f input,label.f select,label.f textarea{width:100%;min-width:0;max-width:100%}
label.f textarea{resize:vertical}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.9rem;color:var(--muted);margin:0 2px 10px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .dash{display:inline-block;width:26px;height:12px;border:2px dashed var(--orange-d);border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .sol{display:inline-block;width:26px;height:12px;border:2px solid var(--green);border-radius:3px;margin-right:6px;vertical-align:-1px}
.gridwrap{background:#fff;border:1px solid var(--line);border-radius:12px;--n:1}
.gridhead,.slot{display:grid;grid-template-columns:104px 104px repeat(var(--n),minmax(0,1fr))}
.gridhead{position:sticky;top:0;z-index:6;background:var(--green);color:#fff;border-radius:11px 11px 0 0;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.gridhead>div{padding:12px 10px;white-space:nowrap}
.gridhead>div.hc{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;padding:10px 14px 10px 6px;line-height:1.1}
.gridhead .hc b{font-size:1rem;letter-spacing:.08em}
.gridhead>div:nth-child(2){border-right:1px solid rgba(255,255,255,.25)}
.gridhead .hc small{display:block;font-size:.8rem;letter-spacing:.02em;text-transform:none;font-weight:600;opacity:.95}
.gridhead>div:nth-child(1){color:var(--orange-t,var(--orange))}
.gridhead>div:nth-child(2){color:var(--lime)}
.gridhead .dh{text-transform:none;letter-spacing:.01em;font-size:1.1rem;border-left:1px solid rgba(255,255,255,.25);overflow:hidden;text-overflow:ellipsis}
.gridhead .dh small{display:block;font-weight:500;font-size:.85rem;color:var(--lime);opacity:.9}
.grid{position:relative}
.slot{height:var(--row);border-top:1px dashed var(--line)}
.slot.hour{border-top:1px solid #d3cbb9}
.slot:first-child{border-top:0}
.slot .t{font-size:.95rem;color:var(--muted);padding:6px 14px 6px 10px;text-align:right;font-variant-numeric:tabular-nums}
.slot .t.uk{border-right:1px solid var(--line)}
.slot .t.ist{font-weight:700;color:var(--green)}
.slot .track{cursor:copy;border-left:1px solid var(--line)}
.slot .track:hover{background:color-mix(in srgb,var(--orange) 12%,#fff)}
.items{position:absolute;left:208px;right:0;top:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));pointer-events:none}
.dcol{position:relative;height:100%}
.card{position:absolute;pointer-events:auto;container-type:inline-size;--tc:var(--green-2);background:color-mix(in srgb,var(--tc) 12%,#fff);border:1.5px solid color-mix(in srgb,var(--tc) 55%,#fff);border-left:7px solid var(--tc);border-radius:9px;padding:6px 12px 5px 11px;overflow:hidden;cursor:grab;user-select:none;touch-action:none;box-shadow:0 1px 2px rgba(1,66,58,.1)}
.card.tentative{border-style:dashed;border-left-style:solid;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--tc) 6%,#fff) 0 9px,color-mix(in srgb,var(--tc) 12%,#fff) 9px 18px)}
.card:hover{box-shadow:0 5px 16px rgba(1,66,58,.22);z-index:4}
.card.dragging{opacity:.88;z-index:9;box-shadow:0 12px 26px rgba(1,66,58,.35);cursor:grabbing}
.card.locked{cursor:default;border-style:solid;border-color:var(--green);border-left-color:var(--tc);background:color-mix(in srgb,var(--tc) 20%,#fff)}
.card.dim{opacity:.25}
.c-head{display:flex;align-items:flex-start;gap:6px}
.c-title{flex:1;font-weight:700;font-size:1.0625rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--green)}
.c-tools{display:none;gap:1px}
.card:hover .c-tools{display:flex}
.c-tools .ib,.lockbtn{padding:2px 5px;color:#33524d}
.lockbtn{border:0;background:none;cursor:pointer;border-radius:5px;display:flex}
.lockbtn:hover{background:rgba(255,255,255,.8)}
.card.locked .lockbtn{color:var(--green)}
.pill{font-size:.7rem;font-weight:800;border-radius:9px;padding:2px 9px;text-transform:uppercase;letter-spacing:.05em;border:0;white-space:nowrap;line-height:1.5;flex:none}
button.pill{cursor:pointer}
.pill.t{background:var(--orange);color:var(--on-orange,#4a2a00)}
.pill.c{background:var(--green);color:var(--lime)}
.c-body{display:block}
.c-time{font-size:.9375rem;color:#27413c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;font-weight:500}
.c-room{font-size:.9375rem;color:#27413c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:5px;align-items:center}
.c-room svg{flex:none}
.c-room .rd{display:none}
.c-people{margin-top:4px;display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.chip{font-size:.8125rem;font-weight:500;background:rgba(255,255,255,.92);border:1px solid color-mix(in srgb,var(--tc) 50%,#fff);border-radius:12px;padding:0 9px;white-space:nowrap}
.chip.xtra{display:none}
.c-note{font-size:.9rem;color:#3d5650;margin-top:4px;white-space:normal;overflow:hidden;line-height:1.35}
.c30 .c-room,.c30 .c-people,.c30 .c-note,.c60 .c-note{display:none}
.c90 .rd,.cbig .rd{display:inline}
@container (min-width:620px){
  .c-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:6px 22px;align-items:start}
  .c-people{margin-top:0;flex-wrap:wrap}
  .chip.xtra{display:inline-block}
  .chip.more{display:none}
  .c-room .rd{display:inline}
  .c-note{margin-top:2px}
  .c60 .c-note,.c90 .c-note{display:block}
  .c30 .c-people{display:flex;flex-wrap:nowrap}
}
.resize{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize;background:linear-gradient(transparent,color-mix(in srgb,var(--tc) 50%,transparent));opacity:0}
.card:hover .resize{opacity:1}
.card.locked .resize{display:none}
.ib{border:0;background:none;color:var(--muted);cursor:pointer;padding:3px 6px;border-radius:5px;font-size:1rem;line-height:1}
.ib:hover{background:#efe9db;color:var(--ink)}
.ib:disabled{opacity:.3;cursor:default}
.ov{position:fixed;inset:0;background:rgba(1,30,26,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:14px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden}
.modal.wide{width:min(800px,100%)}
.modal .mh{background:var(--green);color:var(--lime);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--orange)}
.modal .mh h3{margin:0;font-size:1.15rem}
.modal .mh .ib{color:#fff}
.modal form{padding:18px 20px;display:grid;gap:14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label.f{display:grid;gap:5px;font-weight:600;font-size:.85rem;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);font-weight:400;font-size:1rem;background:#fff}
label.f input:focus,label.f select:focus,label.f textarea:focus,.addrow input:focus,.daybar input:focus,.daybar select:focus{outline:2px solid var(--lime);border-color:var(--green)}
label.f input:disabled,label.f select:disabled,label.f textarea:disabled{background:#f4f1e8;color:#506560}
.roominfo{font-size:.9rem;color:var(--muted);background:#f6f3ea;border-radius:8px;padding:8px 11px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:18px;padding:5px 12px;cursor:pointer;font-size:.95rem;font-weight:500;color:var(--ink)}
.chips label:has(input:checked){background:color-mix(in srgb,var(--lime) 30%,#fff);border-color:var(--green-2)}
.mf{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:4px}
.mf .sp{flex:1}
.lockedmsg{background:color-mix(in srgb,var(--orange) 12%,#fff);border:1px solid color-mix(in srgb,var(--orange) 40%,#fff);color:#7a4300;border-radius:8px;padding:10px 12px;font-size:.95rem}
.stabs{display:flex;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--line)}

/* IST is UTC+05:30 all year. UK time is worked out for the actual date, so it shows GMT or BST correctly. */
function ukParts(date, istMin){
  const [y,m,d] = (date||"2026-11-10").split("-").map(Number);
  const dt = new Date(Date.UTC(y,m-1,d,0,istMin-330));
  const f = new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",hourCycle:"h23"});
  const p = {}; f.formatToParts(dt).forEach(x=>{p[x.type]=x.value;});
  const t = pad(+p.hour)+":"+pad(+p.minute);
  const off = Math.round((Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute)-dt.getTime())/60000);
  const z = off===0?"GMT":off===60?"BST":"UTC"+(off>=0?"+":"-")+Math.abs(off/60);
  return {t, z};
}

/* ========= layout of overlapping items ========= */
function layoutLanes(items){
  const arr=[...items].sort((a,b)=>a.start-b.start||b.dur-a.dur);
  const res=new Map(); let cluster=[], clusterEnd=0;
  const flush=()=>{
    const lanes=[];
    cluster.forEach(it=>{
      let l=lanes.findIndex(end=>end<=it.start);
      if(l<0){l=lanes.length;lanes.push(0);}
      lanes[l]=it.start+it.dur; res.set(it.id,{lane:l});
    });
    cluster.forEach(it=>res.get(it.id).n=lanes.length);
    cluster=[];
  };
  arr.forEach(it=>{
    if(cluster.length && it.start>=clusterEnd) flush();
    cluster.push(it); clusterEnd = cluster.length===1 ? it.start+it.dur : Math.max(clusterEnd,it.start+it.dur);
  });
  if(cluster.length) flush();
  return res;
}

function ensureContrast(fg,bg,min){ /* nudge fg lighter or darker until it reads on bg */

}

  $("#main").innerHTML=h;
  setTb();
  if(VIEW) document.querySelectorAll("#dTitle,#dDate").forEach(x=>{x.disabled=true;});
}

function cardHTML(it,day,pos){
  const end=it.start+it.dur;
  const u1=ukParts(day.date,it.start), u2=ukParts(day.date,end);
  const room=state.rooms.find(r=>r.id===it.roomId);
  const ppl=it.attendees.map(id=>state.attendees.find(a=>a.id===id)).filter(Boolean);
  const cls=it.dur<=15?"c30 c15":it.dur<=30?"c30":it.dur<=60?"c60":it.dur<=90?"c90":"cbig";
  const limit=cls==="c90"?5:cls==="cbig"?7:3;
  const chips=ppl.map((p,i)=>`<span class="chip ${orgCls(p)} ${i>=limit?"xtra":""}">${esc(p.name.split(" ")[0])}</span>`).join("")+(ppl.length>limit?`<span class="chip more">+${ppl.length-limit}</span>`:"");
  const top=(it.start-START)/STEP*ROW, height=it.dur/STEP*ROW-2;
  const left=`calc(${pos.lane/pos.n*100}% + 4px)`, width=`calc(${100/pos.n}% - 8px)`;
  const dim=ui.highlight && !it.attendees.includes(ui.highlight);
  const tent=it.status==="tentative";
  const tip=[it.title+" ("+(tent?"tentative":"confirmed")+(it.locked?", locked":"")+")",`${hm(it.start)}–${hm(end)} IST / ${u1.t}–${u2.t} ${u1.z}`,room?`${room.name}${roomText(room)?": "+roomText(room):""}`:"",ppl.length?"Attendees: "+ppl.map(p=>p.name).join(", "):"",it.notes].filter(Boolean).join("\n");
  const di=state.days.findIndex(d=>d.id===it.dayId);
  const pill = it.locked
    ? `<span class="pill c"><span class="pl">Confirmed</span><span class="ps">✓</span></span>`
    : `<button class="pill ${tent?"t":"c"}" data-act="status" title="${tent?"Tentative":"Confirmed"}. Click to switch between tentative and confirmed"><span class="pl">${tent?"Tentative":"Confirmed"}</span><span class="ps">${tent?"T":"✓"}</span></button>`;
  return `<div class="card ${cls} ${tent?"tentative":""} ${it.locked?"locked":""} ${dim?"dim":""}" data-id="${it.id}" tabindex="0" role="button" aria-label="${esc(tip)}" style="top:${top}px;height:${height}px;left:${left};width:${width};--tc:${(TYP()[it.type]||TYP().session).color}" title="${esc(tip)}">
    <div class="c-head">
      <span class="c-title">${it.dur<=15?`<span class="c15t">${hm(it.start)}</span> `:""}${esc(it.title)}</span>
      <span class="c-tools">
        <button class="ib" data-act="invite" title="Send an Outlook invite for this item">✉</button>
        ${it.locked?"":`<button class="ib" data-act="prev" ${di<=0?"disabled":""} title="Move to previous day">◀</button>
        <button class="ib" data-act="next" ${di>=state.days.length-1?"disabled":""} title="Move to next day">▶</button>
        <button class="ib" data-act="del" title="Delete">✕</button>`}
      </span>
      ${pill}
      <button class="lockbtn" data-act="lock" title="${it.locked?"Locked. Click to unlock":"Click to lock (marks as confirmed)"}">${it.locked?icon.lock:icon.unlock}</button>
    </div>
    <div class="c-body">
      <div class="c-l">
        <div class="c-time"><span class="ct-f">${hm(it.start)}–${hm(end)} IST<span class="ct-u"><i> · </i>${u1.t}–${u2.t} ${u1.z}</span></span><span class="ct-s">${hm(it.start)} IST · ${u1.t} ${u1.z}</span></div>
        ${room?`<div class="c-room">${icon.pin}<b>${esc(room.name)}</b>${roomText(room)?`<span class="rd"> · ${esc(roomText(room))}</span>`:""}</div>`:""}
      </div>
      <div class="c-r">
        ${ppl.length?`<div class="c-people">${chips}</div>`:""}
        ${it.notes?`<div class="c-note">${esc(it.notes)}</div>`:""}
      </div>
    </div>
    <div class="resize"></div>
  </div>`;
}

/* ========= main interactions ========= */
$("#main").addEventListener("click",e=>{
  const gsb=e.target.closest("[data-gs]"); if(gsb){ gsAct(gsb.dataset.gs); return; }
  const sel=e.target.closest("[data-sel]");
  if(sel){
    const id=sel.dataset.sel;
    if(sel.checked){ if(!ui.sel.includes(id)) ui.sel.push(id); ui.dayId=id; }
    else if(ui.sel.length>1){ ui.sel=ui.sel.filter(x=>x!==id); if(ui.dayId===id) ui.dayId=ui.sel[0]; }
    renderMain(); return;
  }
  const tab=e.target.closest(".daytab");
  if(tab){
    const id=tab.dataset.day;
    if(e.ctrlKey||e.metaKey||e.shiftKey){ if(ui.sel.includes(id)){ if(ui.sel.length>1) ui.sel=ui.sel.filter(x=>x!==id); } else ui.sel.push(id); ui.dayId=ui.sel.includes(id)?id:ui.sel[0]; }
    else { ui.sel=[id]; ui.dayId=id; }
    renderMain(); return;
  }
  if(VIEW){
    const vb=e.target.closest("[data-act]");
    if(!(vb&&vb.dataset.act==="allDays")){
      const vc=e.target.closest(".card");
      if(vc&&!vb) openEditor(vc.dataset.id);
      return;
    }
  }
  const btn=e.target.closest("[data-act]");
  if(btn){
    const act=btn.dataset.act, card=btn.closest(".card");
    if(card){
      const it=state.items.find(i=>i.id===card.dataset.id); if(!it) return;
      if(act==="lock"){
        it.locked=!it.locked; if(it.locked) it.status="confirmed";
        save();renderMain();toast(it.locked?"Locked and confirmed":"Unlocked");
      }
      else if(act==="invite"){openInvite(it.id);}
      else if(it.locked){toast("Unlock this item first");}
      else if(act==="status"){it.status=it.status==="tentative"?"confirmed":"tentative";save();renderMain();}
      else if(act==="del"){ deleteItemUndo(it); }
      else if(act==="prev"||act==="next"){
        const i=state.days.findIndex(d=>d.id===it.dayId), j=i+(act==="next"?1:-1);
        if(state.days[j]){it.dayId=state.days[j].id;save();renderMain();toast("Moved to "+dayLabel(state.days[j]));}
      }
      return;
    }
    if(act==="addItem") openEditor(null,{dayId:ui.dayId,start:10*60});
    else if(act==="addDay"){
      const last=state.days[state.days.length-1];
      const d={id:uid(),date:addDays(last.date,1),title:"New day"};
      state.days.push(d);ui.dayId=d.id;ui.sel=[d.id];save();render();
    }
    else if(act==="allDays"){
      ui.sel = state.days.map(d=>d.id);
      renderMain();
    }
    else if(act==="delDay") deleteDay();
    return;
  }
  const track=e.target.closest(".track");
  if(track){
    const r=track.getBoundingClientRect();
    const m=Number(track.closest(".slot").dataset.m)+((e.clientY-r.top)>r.height/2?SNAP:0);
    openEditor(null,{dayId:track.dataset.day,start:Math.min(m,END-SNAP)});
  }
});
$("#main").addEventListener("keydown",e=>{
  const kc=e.target.classList&&e.target.classList.contains("card")?e.target:null;
  if(kc){
    const kit=state.items.find(i=>i.id===kc.dataset.id);
    if(kit&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); openEditor(kit.id); return; }
    if(kit&&!VIEW&&!kit.locked&&(e.key==="Delete"||e.key==="Backspace")){ e.preventDefault(); deleteItemUndo(kit); return; }
  }
  const tab=e.target.closest&&e.target.closest(".daytab");
  if(tab&&e.target===tab&&(e.key==="Enter"||e.key===" ")){e.preventDefault();ui.sel=[tab.dataset.day];ui.dayId=tab.dataset.day;renderMain();}
});
$("#main").addEventListener("change",e=>{
  const day=curDay();
  if(e.target.id==="dDate"&&e.target.value){day.date=e.target.value;save();renderMain();}
  if(e.target.id==="dHl"){ui.highlight=e.target.value||null;renderMain();}
});
$("#main").addEventListener("input",e=>{
  if(e.target.id==="dTitle"){curDay().title=e.target.value;save();
    const t=document.querySelector(".daytab[data-day='"+curDay().id+"'] small"); if(t) t.textContent=e.target.value;}
});
function deleteDay(){
  const day=curDay();
  if(state.days.length<2){toast("Keep at least one day");return;}
  const its=state.items.filter(i=>i.dayId===day.id);
  if(its.some(i=>i.locked)){toast("This day has locked items. Unlock them first.");return;}
  if(!confirm("Delete "+dayLabel(day)+" and its "+its.length+" agenda items?")) return;
  state.items=state.items.filter(i=>i.dayId!==day.id);
  state.days=state.days.filter(d=>d.id!==day.id);
  ui.dayId=state.days[0].id;ui.sel=[ui.dayId];save();render();
}

/* drag, move and resize */
$("#main").addEventListener("pointerdown",e=>{
  if(VIEW) return;
  const card=e.target.closest(".card");
  if(!card||e.button!==0||e.target.closest("button")) return;
  const it=state.items.find(i=>i.id===card.dataset.id); if(!it) return;
  drag={it,card,mode:e.target.closest(".resize")?"resize":"move",x:e.clientX,y:e.clientY,moved:false,start:it.start,dur:it.dur,ns:it.start,nd:it.dur,target:null,viaTab:false};
  try{card.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();
});
document.addEventListener("pointermove",e=>{
  if(!drag) return;
  const d=drag, dy=e.clientY-d.y;
  if(!d.moved && Math.abs(dy)<5 && Math.abs(e.clientX-d.x)<5) return;
  if(d.it.locked) return;
  d.moved=true; d.card.classList.add("dragging");
  const ds=Math.round(dy/(ROW*SNAP/STEP))*SNAP;
  if(d.mode==="move"){
    d.ns=clamp(d.start+ds,START,END-d.dur);
    d.card.style.top=((d.ns-START)/STEP*ROW)+"px";
    if(ui.sel.length>1) d.card.style.transform="translateX("+(e.clientX-d.x)+"px)";
    const els=document.elementsFromPoint(e.clientX,e.clientY);
    const tab=els.find(x=>x.matches&&x.matches(".daytab"));
    let col=null;
    document.querySelectorAll(".gridhead .dh").forEach(h=>{const r=h.getBoundingClientRect(); if(e.clientX>=r.left&&e.clientX<r.right) col=h;});
    document.querySelectorAll(".dropping").forEach(x=>x.classList.remove("dropping"));
    let target=null, via=false, hl=null;
    if(tab){target=tab.dataset.day;via=true;hl=tab;}
    else if(col){target=col.dataset.day;hl=document.querySelector('.dh[data-day="'+target+'"]');}
    d.target=(target&&target!==d.it.dayId)?target:null; d.viaTab=via;
    if(d.target&&hl) hl.classList.add("dropping");
  }else{
    d.nd=clamp(d.dur+ds,SNAP,END-d.start);
    d.card.style.height=(d.nd/STEP*ROW-2)+"px";
  }
});
function endDrag(e,cancel){
  if(!drag) return;
  const d=drag; drag=null;
  document.querySelectorAll(".dropping").forEach(x=>x.classList.remove("dropping"));
  if(cancel){renderMain();return;}
  if(!d.moved){openEditor(d.it.id);return;}
  if(d.mode==="move"){
    if(d.target){
      d.it.dayId=d.target; d.it.start=d.viaTab?d.start:d.ns;
      toast("Moved to "+dayLabel(state.days.find(x=>x.id===d.target)));
    }else d.it.start=d.ns;
  }else d.it.dur=d.nd;
  save();renderMain();
}
document.addEventListener("pointerup",e=>endDrag(e,false));
document.addEventListener("pointercancel",e=>endDrag(e,true));


/* hover hint on empty slots: shows the start time a click will use (:00/:30, or :15/:45 in the lower half) */
let hintTrack=null;
function clearHint(){ if(hintTrack){ delete hintTrack.dataset.hint; delete hintTrack.dataset.half; hintTrack=null; } }
$("#main").addEventListener("mousemove",e=>{
  if(VIEW||drag) { clearHint(); return; }
  const tr=e.target.closest&&e.target.closest(".track");
  if(!tr){ clearHint(); return; }
  if(tr!==hintTrack){ clearHint(); hintTrack=tr; }
  const r=tr.getBoundingClientRect(), half=(e.clientY-r.top>r.height/2)?1:0;
  const m=Number(tr.closest(".slot").dataset.m)+half*SNAP;
  const txt="+ "+hm(m);
  if(tr.dataset.hint!==txt){ tr.dataset.hint=txt; tr.dataset.half=String(half); }
});
$("#main").addEventListener("mouseleave",clearHint);

/* PDF: a replica of the on-screen agenda. The same header, legend, grid and cards are rebuilt for print,
   trimmed to the hours in use and scaled so each page fits A4 with nothing cut off. */
const MM=96/25.4;
function pgRange(days){
  let lo=Infinity,hi=-Infinity;
  days.forEach(d=>state.items.filter(i=>i.dayId===d.id).forEach(i=>{lo=Math.min(lo,i.start);hi=Math.max(hi,i.start+i.dur);}));
  if(lo===Infinity){lo=START;hi=Math.min(END,START+240);}
  lo=Math.max(START,Math.floor(lo/60)*60); hi=Math.min(END,Math.ceil(hi/60)*60);
  if(hi-lo<120){hi=Math.min(END,lo+120); if(hi-lo<120) lo=Math.max(START,hi-120);}
  return [lo,hi];
}
function pgKey(days){
  const ids=new Set(), rids=new Set();
  days.forEach(d=>state.items.filter(i=>i.dayId===d.id).forEach(i=>{i.attendees.forEach(a=>ids.add(a)); if(i.roomId) rids.add(i.roomId);}));
  const ppl=state.attendees.filter(a=>ids.has(a.id)), rms=state.rooms.filter(r=>rids.has(r.id));
  if(!ppl.length&&!rms.length) return "";
  return `<div class="pp-key">${rms.length?`<div><b>Venues</b>${rms.map(r=>`<span>${esc(r.name)}${roomText(r)?` <em>${esc(roomText(r))}</em>`:""}</span>`).join("")}</div>`:""}${ppl.length?`<div><b>Attendees</b>${ppl.map(a=>`<span>${esc(a.name)}</span>`).join("")}</div>`:""}</div>`;
}
function pgBuild(days,lo,hi,row,z,W,pageNo,total,key,orient){
  const sv={START,ROW,SLOTS,hl:ui.highlight};
  START=lo; ROW=row; SLOTS=(hi-lo)/STEP; ui.highlight=null;
  try{
    const n=days.length, zone=ukParts(days[0].date,12*60).z;
    const hd=document.querySelector("header.top").cloneNode(true);
    hd.querySelectorAll(".actions").forEach(x=>x.remove());
    hd.querySelectorAll("[id]").forEach(x=>x.removeAttribute("id"));
    hd.querySelectorAll("[title]").forEach(x=>x.removeAttribute("title"));
    const lg=`<div class="legend">${Object.values(TYP()).map(t=>`<span><i style="background:${t.color}"></i>${esc(t.label)}</span>`).join("")}<span><span class="dash"></span>Tentative</span><span><span class="sol"></span>Confirmed</span></div>`;
    let g=`<div class="gridwrap" style="--n:${n};--row:${row}px"><div class="gridhead"><div class="hc"><b>IST</b><small>India</small></div><div class="hc"><b>UK</b><small>${zone}</small></div>${days.map(d=>`<div class="dh">${esc(dayLabel(d))}${d.title?`<small>${esc(d.title)}</small>`:""}</div>`).join("")}</div><div class="grid">`;
    for(let i=0;i<SLOTS;i++){const m=lo+i*STEP; g+=`<div class="slot ${m%60===0?"hour":""}"><div class="t ist">${hm(m)}</div><div class="t uk">${ukParts(days[0].date,m).t}</div>${days.map(()=>`<div class="track"></div>`).join("")}</div>`;}
    g+=`<div class="items" style="height:${SLOTS*row}px">${days.map(d=>{
      const di=state.items.filter(i=>i.dayId===d.id), lanes=layoutLanes(di);
      return `<div class="dcol">${di.map(it=>cardHTML(it,d,lanes.get(it.id))).join("")}</div>`;}).join("")}</div></div></div>`;
    return `<section class="pp ${orient}"><div class="pp-z" style="zoom:${z};width:${W}px">${hd.outerHTML}${lg}${g}</div>${key}</section>`;
  } finally { START=sv.START; ROW=sv.ROW; SLOTS=sv.SLOTS; ui.highlight=sv.hl; }
}
function buildPrint(mode){
  const land=mode==="one", orient=land?"landscape":"portrait";
  const pw=(land?277:190)*MM, ph=(land?190:277)*MM;
  const sets=land?[state.days]:state.days.map(d=>[d]);
  const ps=$("#printSheet"); ps.className=orient;
  setPage(orient);
  ps.innerHTML=""; ps.classList.add("measuring");
  ps.style.width=pw+"px";
  const out=sets.map((days,idx)=>{
    const [lo,hi]=pgRange(days), N=(hi-lo)/STEP, key="";
    /* measure the fixed parts (header, legend, day heads, key) at a typical width */
    const W0=pw/0.8;
    ps.innerHTML=pgBuild(days,lo,hi,60,0.8,W0,1,1,key,orient);
    const zEl=ps.querySelector(".pp-z"), fixed=(zEl.offsetHeight-N*60);
    const keyH=(ps.querySelector(".pp-key")||{offsetHeight:0}).offsetHeight;
    const avail=ph-1*MM-keyH-(key?4*MM:0);
    /* prefer a comfortable text size: shrink rows a little before shrinking everything */
    const row=Math.max(land?46:46,Math.min(60,(avail/0.82-fixed)/N));
    const z=Math.min(1,avail/(fixed+N*row));
    return {days,lo,hi,row,z,W:Math.round(pw/z),key};
  });
  ps.innerHTML=out.map((o,i)=>pgBuild(o.days,o.lo,o.hi,o.row,o.z,o.W,i+1,out.length,o.key,orient)).join("");
  /* a card that cannot hold everything drops detail in order: a single row of names (+N), then the note, then venue detail */
  ps.querySelectorAll(".pp .card").forEach(c=>{
    for(const k of ["tight","onerow","nonote","nord"]){ if(c.scrollHeight<=c.clientHeight+1) break; c.classList.add(k); }
  });
  ps.classList.remove("measuring"); ps.style.width="";
}
function exportPDF(mode){
  buildPrint(mode);
  toast('In the print dialog, choose "Save as PDF" and turn on "Background graphics"');
  setTimeout(()=>window.print(),350);
}

const _enc=new TextEncoder();
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function zipStore(files){
  const parts=[],cen=[];let off=0;
  files.forEach(f=>{
    const nm=_enc.encode(f.name),d=f.data,crc=crc32(d);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,d.length,true);lh.setUint32(22,d.length,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,d);

function buildXLSX(st){

  st.days.forEach(d=>{
    st.items.filter(i=>i.dayId===d.id).sort((a,b)=>a.start-b.start||b.dur-a.dur).forEach(i=>{
      const end=i.start+i.dur,u1=ukParts(d.date,i.start),u2=ukParts(d.date,end);
      const room=st.rooms.find(r=>r.id===i.roomId);
      const ppl=i.attendees.map(id=>st.attendees.find(a=>a.id===id)).filter(Boolean).map(personLabel).join(", ");
      agenda.push([dayLabel(d)+(d.title?" - "+d.title:""),d.date,hm(i.start),hm(end),u1.t,u2.t,u1.z,i.title,(TYP()[i.type]||TYP().session).label,i.status==="tentative"?"Tentative":"Confirmed",i.locked?"Yes":"No",room?room.name:"",roomText(room),ppl,i.notes]);

  const att=[["Name","Role","Organisation","Email","Agenda items"]].concat(st.attendees.map(a=>[a.name,a.role||"",a.org||"",a.email||"",String(st.items.filter(i=>i.attendees.includes(a.id)).length)]));

  const sheets=[["Agenda",agenda,[28,12,11,11,11,11,9,40,16,12,8,22,44,50,50]],["Attendees",att,[26,34,20,14]],["Venues",rms,[26,30,12,60,14]]];
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const files=[
    ["[Content_Types].xml",X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")+'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
    ["_rels/.rels",X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ["xl/workbook.xml",X+'<workbook '+NS+' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((s,i)=>`<sheet name="${s[0]}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")+'</sheets></workbook>'],
    ["xl/_rels/workbook.xml.rels",X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")+`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["xl/styles.xml",X+'<styleSheet '+NS+'><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFC8FF66"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF01423A"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>']
  ];
  sheets.forEach((s,i)=>files.push([`xl/worksheets/sheet${i+1}.xml`,sheetXML(s[1],s[2])]));

}

}

$("#fileImport").onchange=e=>{

  r.onload=()=>{
    try{
      const s=JSON.parse(r.result);
      if(s&&s.agendaLibrary&&Array.isArray(s.visits)){
        const vs=s.visits.filter(valid).map(normalise); if(!vs.length) throw new Error("bad");
        if(!confirm("Add "+vs.length+" visit"+(vs.length===1?"":"s")+" from this backup? Your current visits are kept.")) return;
        save(); let last=null; vs.forEach(v=>{ last=addVisit(v); }); saveIdx(); switchVisit(last); toast("Added "+vs.length+" visit"+(vs.length===1?"":"s")); return;
      }

$("#fileLogo").onchange=e=>{
  const f=e.target.files[0]; if(!f||!logoTarget) return;
  const r=new FileReader(), key=logoTarget;
  const apply=u=>{state.logos[key]=u;save();renderBrand();if(sOv)drawSettings();toast("Logo updated");};
  r.onload=()=>{
    const src=r.result;
    if(/^data:image\/svg/.test(src)){ apply(src); return; }
    const im=new Image();
    im.onload=()=>{ /* shrink big logos so many visits fit in the browser's storage */
      const k=Math.min(1,500/Math.max(im.naturalWidth,im.naturalHeight)||1);
      if(k>=1&&src.length<150000){ apply(src); return; }
      const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(im.naturalWidth*k)); c.height=Math.max(1,Math.round(im.naturalHeight*k));
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      try{ apply(c.toDataURL("image/png")); }catch(_){ apply(src); }
    };
    im.onerror=()=>apply(src); im.src=src;
  };
  r.readAsDataURL(f); e.target.value="";
};

function utcIso(date,istMin){
  const [y,m,d]=date.split("-").map(Number);
  return new Date(Date.UTC(y,m-1,d,0,istMin-330)).toISOString().replace(/\.\d{3}Z$/,"Z");
}
function inviteText(it){
  const day=state.days.find(d=>d.id===it.dayId), room=state.rooms.find(r=>r.id===it.roomId);
  const end=it.start+it.dur, u1=ukParts(day.date,it.start), u2=ukParts(day.date,end);
  const lines=[hm(it.start)+"–"+hm(end)+" IST  /  "+u1.t+"–"+u2.t+" "+u1.z];
  if(room) lines.push("Venue: "+room.name+(roomText(room)?" ("+roomText(room)+")":""));
  if(it.notes) lines.push("",it.notes);
  return lines.join("\n");
}
function openInvite(id){
  const it=state.items.find(i=>i.id===id); if(!it) return;
  const day=state.days.find(d=>d.id===it.dayId), room=state.rooms.find(r=>r.id===it.roomId);
  let site="work"; try{ site=localStorage.getItem("agenda-outlook-site")||"work"; }catch(e){}
  const ov=document.createElement("div"); ov.className="ov";
  const rows=state.attendees.map(a=>{
    const has=!!(a.email&&a.email.trim()), on=it.attendees.includes(a.id)&&has;
    return `<label class="${has?"":"off"}"><input type="checkbox" data-aid="${a.id}" ${on?"checked":""} ${has?"":"disabled"}><b>${esc(a.name)}</b>
      ${has?`<span class="em">${esc(a.email)}</span>`:`<input type="email" data-addem="${a.id}" placeholder="Add email to invite ${esc(a.name.split(" ")[0])}">`}</label>`;
  }).join("")||'<p class="hint">Add attendees in Settings first.</p>';
  ov.innerHTML=`<div class="modal narrow" role="dialog" aria-modal="true">
    <div class="mh"><h3>Send Outlook invite</h3><button class="ib" data-x title="Close">✕</button></div>
    <form onsubmit="return false">
      <div class="lockedmsg" style="background:color-mix(in srgb,var(--lime) 28%,#fff);color:var(--ink)"><b>${esc(it.title)}</b><br>${esc(dayLabel(day))} · ${hm(it.start)}–${hm(it.start+it.dur)} IST${room?" · "+esc(room.name):""}</div>
      <div class="f"><span style="font-weight:600;font-size:12px;color:var(--muted)">Invite these people <button type="button" class="btn small" data-all>All</button> <button type="button" class="btn small" data-none>None</button></span>
        <div class="hint" style="margin:0 0 4px">Greyed names have no email yet. Type one next to the name to include them. It is saved in Settings, Attendees for next time.</div><div class="invlist">${rows}</div></div>
      <label class="f">Anyone else (optional, separate emails with commas)<input id="invExtra" placeholder="name@company.com, name2@company.com"></label>
      <label style="display:flex;gap:8px;align-items:center;font-size:.9375rem"><input type="checkbox" id="invTent" ${it.status==="tentative"?"checked":""}> Add "Tentative:" to the meeting title</label>
      <label class="f">Open in<select id="invSite"><option value="work" ${site==="work"?"selected":""}>Outlook for work or school (Microsoft 365)</option><option value="live" ${site==="live"?"selected":""}>Outlook.com (personal)</option></select></label>
      <div class="hint" style="margin:0">Outlook opens with the invite ready. Check it, then press Send there. Times go in IST and each person sees their own local time.</div>
      <div class="mf"><button type="button" class="btn" data-copy>Copy details</button><span class="sp"></span><button type="button" class="btn" data-x>Cancel</button><button type="button" class="btn primary" data-go>Open in Outlook</button></div>
    </form></div>`;
  document.body.appendChild(ov);
  const close=()=>{ov.remove();document.removeEventListener("keydown",onKey);};
  const onKey=e=>{if(e.key==="Escape")close();};
  document.addEventListener("keydown",onKey);
  const emails=()=>{
    const list=[...ov.querySelectorAll("[data-aid]:checked")].map(c=>{const a=state.attendees.find(x=>x.id===c.dataset.aid);return a&&a.email.trim();}).filter(Boolean);
    String(ov.querySelector("#invExtra").value||"").split(/[,;\s]+/).filter(x=>/.+@.+/.test(x)).forEach(x=>list.push(x));
    return [...new Set(list)];
  };
  ov.addEventListener("change",e=>{
    const ae=e.target.dataset&&e.target.dataset.addem;
    if(ae){
      const v=e.target.value.trim(); if(!/.+@.+\..+/.test(v)){ if(v) toast("That does not look like an email address"); return; }
      const a=state.attendees.find(x=>x.id===ae); a.email=v; save();
      const lab=e.target.closest("label"); lab.classList.remove("off");
      lab.innerHTML=`<input type="checkbox" data-aid="${a.id}" checked><b>${esc(a.name)}</b><span class="em">${esc(v)}</span>`;
    }
  });
  ov.addEventListener("click",e=>{
    if(e.target.closest("[data-x]")) close();
    else if(e.target.closest("[data-all]")) ov.querySelectorAll("[data-aid]:not(:disabled)").forEach(c=>c.checked=true);
    else if(e.target.closest("[data-none]")) ov.querySelectorAll("[data-aid]").forEach(c=>c.checked=false);
    else if(e.target.closest("[data-copy]")){
      const txt=it.title+"\n"+dayLabel(day)+"\n"+inviteText(it);
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Details copied")).catch(()=>toast("Could not copy. Select and copy the text manually."));
    }
    else if(e.target.closest("[data-go]")){
      const to=emails(); if(!to.length){toast("Choose at least one person to invite");return;}
      const site=ov.querySelector("#invSite").value; try{ localStorage.setItem("agenda-outlook-site",site); }catch(_){}
      const subject=(ov.querySelector("#invTent").checked?"Tentative: ":"")+it.title;
      const loc=room?room.name+(room.location?", "+room.location:""):"";
      const q=new URLSearchParams({path:"/calendar/action/compose",rru:"addevent",subject:subject,startdt:utcIso(day.date,it.start),enddt:utcIso(day.date,it.start+it.dur),body:(it.notes||""),location:loc,to:to.join(";")});
      const base=site==="live"?"https://outlook.live.com/calendar/0/deeplink/compose":"https://outlook.office.com/calendar/0/deeplink/compose";
      const w=window.open(base+"?"+q.toString().replace(/\+/g,"%20"),"_blank","noopener");
      if(!w) toast("Your browser blocked the pop-up. Allow pop-ups for this file and try again.");
      else close();
    }
  });
}

function downloadIcon(){
  const bin=atob(ICO_B64), u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u],{type:"image/x-icon"}));
  const a=document.createElement("a"); a.href=url; a.download="Visit-Agenda-Icon.ico"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast("Icon saved as Visit-Agenda-Icon.ico in your Downloads folder.");
}
/* ===== visits: switch, add, duplicate, rename, delete ===== */
function switchVisit(id){
  if(id===LIB.current) return;
  save();
  const s=readVisit(id); if(!s){ toast("Could not open that visit"); return; }
  state=s; LIB.current=id; saveIdx();
  ui={dayId:state.days[0].id,sel:state.days.map(d=>d.id),highlight:null};
  closeSettings(); render(); toast("Opened "+(state.cfg.title||"visit"));
}
function newVisit(kind){
  save();
  let s;
  if(kind==="blank"){ s=normalise(blankSeed()); s.cfg.title="New visit"; }
  else{
    s=JSON.parse(JSON.stringify(state));
    if(kind==="copy"){ s.cfg.title=(state.cfg.title||"Visit")+" (copy)"; }
    else{ /* same client again: keep branding, people, venues and hours; start with empty days */
      const b=blankSeed(); s.days=b.days; s.items=[]; s.cfg.title=(state.cfg.title||"Visit")+" (new)";
    }
  }
  const id=addVisit(normalise(s)); LIB.current=id; state=readVisit(id); saveIdx();
  ui={dayId:state.days[0].id,sel:state.days.map(d=>d.id),highlight:null};
  closeSettings(); render(); toast("New visit created. Rename it in Settings > Branding.");
}
let vOv=null;
function openVisits(){
  if(vOv) return;
  vOv=document.createElement("div"); vOv.className="ov";
  const draw=()=>{
    vOv.innerHTML=`<div class="modal narrow" role="dialog" aria-modal="true">
      <div class="mh"><h3>Your visits</h3><button class="ib" data-x title="Close">✕</button></div>
      <div style="padding:16px 20px">
        <ul class="vlist">${LIB.order.map(o=>`<li class="${o.id===LIB.current?"cur":""}" data-id="${o.id}">
          <button class="vn" data-act="open" title="Open this visit">${esc(o.name)}</button>
          ${o.id===LIB.current?'<span class="vm">Open now</span>':""}
          <button class="btn small" data-act="rename">Rename</button>
          <button class="btn small" data-act="dup">Duplicate</button>
          <button class="btn small danger" data-act="del">Delete</button></li>`).join("")}</ul>
        <div class="hint" style="margin:0 0 10px">Each visit has its own agenda, people, venues, branding and hours.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn primary" data-act="newBlank">+ New blank visit</button>
          <button class="btn" data-act="newSame" title="Keeps the title style, logos, colours, people, venues and hours. Starts with no agenda items.">+ New visit, same client</button>
        </div>
      </div></div>`;
  };
  draw(); document.body.appendChild(vOv);
  const close=()=>{ if(!vOv) return; vOv.remove(); vOv=null; document.removeEventListener("keydown",onKey); };
  const onKey=e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown",onKey);
  vOv.addEventListener("click",e=>{
    if(e.target.closest("[data-x]")){ close(); return; }
    const b=e.target.closest("[data-act]"); if(!b) return;
    const act=b.dataset.act, li=b.closest("li"), id=li&&li.dataset.id;
    if(act==="open"){ close(); switchVisit(id); }
    else if(act==="newBlank"){ close(); newVisit("blank"); }
    else if(act==="newSame"){ close(); newVisit("same"); }
    else if(act==="dup"){ close(); if(id!==LIB.current) switchVisit(id); newVisit("copy"); }
    else if(act==="rename"){
      const cur=LIB.order.find(o=>o.id===id); const nm=prompt("Visit name (also the page title):",cur.name);
      if(nm&&nm.trim()){
        if(id===LIB.current){ state.cfg.title=nm.trim(); save(); renderBrand(); }
        else{ const s=readVisit(id); s.cfg.title=nm.trim(); writeVisit(id,s); cur.name=nm.trim(); saveIdx(); }
        draw();
      }
    }
    else if(act==="del"){
      const cur=LIB.order.find(o=>o.id===id);
      if(!confirm('Delete "'+cur.name+'" and everything in it? This cannot be undone.')) return;
      try{ localStorage.removeItem(vKey(id)); }catch(_){}
      LIB.order=LIB.order.filter(o=>o.id!==id);
      if(!LIB.order.length){ const s=normalise(blankSeed()); s.cfg.title="New visit"; LIB.current=addVisit(s); state=readVisit(LIB.current); saveIdx(); ui={dayId:state.days[0].id,sel:state.days.map(d=>d.id),highlight:null}; render(); }
      else if(id===LIB.current){ LIB.current=LIB.order[0].id; state=readVisit(LIB.current); saveIdx(); ui={dayId:state.days[0].id,sel:state.days.map(d=>d.id),highlight:null}; render(); }
      else saveIdx();
      draw();
    }
  });
}
$("#bVisits").onclick=openVisits;

function makeFile(mode){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  const label=d.getDate()+" "+d.toLocaleString("en-GB",{month:"short"})+" "+d.getFullYear()+", "+p(d.getHours())+":"+p(d.getMinutes());
  save();
  const cfg={mode:mode,build:String(Date.now()),label:label,seed:null};
  if(mode==="view") cfg.seed=JSON.parse(JSON.stringify(state));
  else{ const vs=LIB.order.map(o=>o.id===LIB.current?state:readVisit(o.id)).filter(Boolean); cfg.lib={current:Math.max(0,LIB.order.findIndex(o=>o.id===LIB.current)),visits:JSON.parse(JSON.stringify(vs))}; try{localStorage.setItem(bkKey,String(Date.now()));}catch(e){} }
  if(mode==="view") cfg.seed.attendees.forEach(a=>{ delete a.email; }); /* never send people's email addresses to the client */
  const json=JSON.stringify(cfg).replace(/</g,"\\u003c");
  const open="<scr"+'ipt id="cfg">', close="</scr"+"ipt>";
  const a=SRC.indexOf(open); if(a<0){toast("Could not build the file");return;}
  const b=SRC.indexOf(close,a);
  const html=SRC.slice(0,a)+open+"window.CFG="+json+";"+SRC.slice(b);
  const name=slug(state.cfg.title)+(mode==="view"?"_Read-only_":"_Master_")+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes())+".html";
  const url=URL.createObjectURL(new Blob([html],{type:"text/html"}));
  const link=document.createElement("a"); link.href=url; link.download=name; document.body.appendChild(link); link.click(); link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast((mode==="view"?"Shareable file downloaded: ":"Master file saved: ")+name);
}
$("#bShare").onclick=()=>makeFile("view");
if(VIEW){
  $(".titles p").insertAdjacentHTML("afterend",'<p class="vb" title="Version '+esc(CFG.label||"")+'">Read only View</p>');
  document.title=document.title+" (view only)";
}


/* ===== automatic backup: one file chosen once, rewritten after every change (Edge and Chrome) ===== */
const AB={h:null,state:"off",last:0,timer:null,skip:false,err:""};
const ABSUP=!VIEW&&typeof window.showSaveFilePicker==="function"&&typeof indexedDB!=="undefined";
function abDB(){return new Promise((res,rej)=>{const r=indexedDB.open("visit-agenda-ab",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function abGet(){try{const db=await abDB();return await new Promise(res=>{const q=db.transaction("h").objectStore("h").get("handle");q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}catch(e){return null;}}
async function abPut(h){try{const db=await abDB();await new Promise((res,rej)=>{const tx=db.transaction("h","readwrite");if(h)tx.objectStore("h").put(h,"handle");else tx.objectStore("h").delete("handle");tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}catch(e){}}
const abBlank=()=>LIB.order.length<=1&&!state.items.length;
function abPayload(){const vs=LIB.order.map(o=>o.id===LIB.current?state:readVisit(o.id)).filter(Boolean);return JSON.stringify({agendaLibrary:1,visits:vs},null,2);}
async function abWrite(force){
  if(!ABSUP||!AB.h) return false;
  if(!force&&abBlank()) return false; /* never overwrite a backup with an empty planner */
  try{
    const p=await AB.h.queryPermission({mode:"readwrite"});
    if(p!=="granted"){AB.state="paused";abUI();return false;}
    const w=await AB.h.createWritable(); await w.write(abPayload()); await w.close();
    AB.last=Date.now(); AB.state="on"; AB.err="";
    try{localStorage.setItem(bkKey,String(AB.last));}catch(e){}
    abUI(); return true;
  }catch(e){AB.state="error";AB.err=(e&&e.message)||"unknown error";abUI();return false;}
}
function abSchedule(){ if(!ABSUP||!AB.h) return; clearTimeout(AB.timer); AB.timer=setTimeout(()=>abWrite(false),1500); }
const abTime=()=>new Date(AB.last).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
function abRowInner(){
  if(!ABSUP) return '<div><b>Automatic backup</b><span>Needs Microsoft Edge or Google Chrome. In this browser, use the manual backups below.</span></div>';
  if(!AB.h) return '<div><b>Automatic backup</b><span>Off. Choose a file once and the planner saves every change to it. A OneDrive folder is a good home.</span></div><button class="btn primary" data-act="abSetup">Set up</button>';
  const msg=AB.state==="on"?"On. Last saved "+(AB.last?abTime():"just now")+" to "+esc(AB.h.name||"your backup file")+".":AB.state==="paused"?"Paused. Click Resume to start saving again.":"Could not save: "+esc(AB.err);
  const btn=AB.state==="paused"?'<button class="btn primary" data-act="abResume">Resume</button>':'<button class="btn" data-act="abSetup">Change file</button>';
  return '<div><b>Automatic backup</b><span>'+msg+'</span></div><span class="grow"></span>'+btn+' <button class="btn" data-act="abOff">Turn off</button>';
}
function abUI(){
  const r=document.getElementById("abRow"); if(r) r.innerHTML=abRowInner();
  const bar=document.getElementById("abBar"); if(!bar) return;
  let h="", bad=false;
  if(AB.h&&AB.state==="paused") h='<span class="grow"><b>Auto-backup is paused.</b> Click once to start saving to your backup file again.</span><button class="btn primary" data-act="abResume">Resume</button>';
  else if(AB.h&&AB.state==="error"){bad=true;h='<span class="grow"><b>Auto-backup could not save.</b> '+esc(AB.err)+'</span><button class="btn primary" data-act="abSetup">Choose file again</button>';}
  bar.innerHTML=h; bar.hidden=!h; bar.classList.toggle("bad",bad);
  try{ refreshGS(); }catch(_){}
}
async function abSetup(){
  try{
    const h=await window.showSaveFilePicker({suggestedName:"Visit-Agenda-Auto-Backup.json",startIn:"documents",types:[{description:"Visit Agenda backup",accept:{"application/json":[".json"]}}]});
    let existing=null;
    try{ const txt=await (await h.getFile()).text(); if(txt.trim()){ const s=JSON.parse(txt); if(s&&s.agendaLibrary&&Array.isArray(s.visits)) existing=s.visits.filter(valid).map(normalise); } }catch(_){}
    if(existing&&existing.length){
      if(abBlank()){
        if(confirm("This file already holds a backup of "+existing.length+" visit"+(existing.length===1?"":"s")+". Load them into the planner?\n\nOK = load them and keep saving to this file.\nCancel = choose a different file.")){
          AB.h=h; await abPut(h);
          let last=null; existing.forEach(v=>{last=addVisit(v);}); saveIdx(); switchVisit(last); await abWrite(true); toast("Backup loaded. Auto-backup is on"); abUI(); return;
        } else return;
      } else if(!confirm("This file already holds a backup. Replace it with your current work, and keep saving to it?")) return;
    }
    AB.h=h; await abPut(h); AB.skip=false;
    const ok=await abWrite(true);
    toast(ok?"Auto-backup is on":"Could not write to that file");
  }catch(e){ if(!e||e.name!=="AbortError") toast("Auto-backup could not be set up here"); }
  abUI();
}
async function abResume(){
  try{ const p=await AB.h.requestPermission({mode:"readwrite"}); if(p==="granted"){ await abWrite(true); toast("Auto-backup resumed"); } }catch(e){}
  abUI();
}
async function abOff(){ AB.h=null; AB.state="off"; clearTimeout(AB.timer); await abPut(null); abUI(); toast("Auto-backup is off"); }
if(ABSUP){
  document.getElementById("abBar").addEventListener("click",e=>{
    const b=e.target.closest("[data-act]"); if(!b) return;
    if(b.dataset.act==="abSetup") abSetup(); else if(b.dataset.act==="abResume") abResume(); else if(b.dataset.act==="abLater"){AB.skip=true;abUI();}
  });
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&AB.timer){ clearTimeout(AB.timer); abWrite(false); } });
  (async()=>{
    AB.h=await abGet();
    if(AB.h){
      try{ const p=await AB.h.queryPermission({mode:"readwrite"}); AB.state=p==="granted"?"on":"paused"; }catch(e){ AB.state="paused"; }
      if(AB.state==="on") abWrite(false);
    }
    abUI();
  })();
}

function labelControls(root){
  (root||document).querySelectorAll("button:not([aria-label]),[data-act]:not([aria-label])").forEach(b=>{
    const txt=(b.textContent||"").trim();
    if(b.title&&(!txt||txt.length<=2)) b.setAttribute("aria-label",b.title);
  });
}
new MutationObserver(()=>labelControls()).observe(document.body,{childList:true,subtree:true});
labelControls();

render();
if(!VIEW){
  try{
    const last=Number(localStorage.getItem(bkKey)||0), anyWork=LIB.order.length>1||state.items.length>0;
    if(!last&&anyWork) localStorage.setItem(bkKey,String(Date.now()));
    else if(last&&anyWork&&Date.now()-last>14*864e5) setTimeout(()=>toast("It is over two weeks since your last backup. Settings > Data and backup > Save master file."),1200);
  }catch(e){}
}
</script>
</body>
</html>
